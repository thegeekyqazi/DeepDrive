name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name DeepDrive --add-data "static;static" --add-data "index.html;." server.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeepDrive.exe
          generate_release_notes: true
